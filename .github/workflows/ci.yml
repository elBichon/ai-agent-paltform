
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Check dependency consistency
        run: pip check

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py api.py

      - name: Lint Python code
        run: |
          ruff check app.py api.py tests/

      - name: Run automated tests
        env:
          # Dummy test-only values. Never use production credentials here.
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          FLASK_SECRET_KEY: ci-only-not-a-production-secret
        run: |
          if [ ! -d tests ]; then
            echo "::error::Missing tests/ directory. Add automated tests before enabling required CI checks."
            exit 1
          fi
          pytest -q
