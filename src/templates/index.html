{% extends 'layout.html' %}

{% block content %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">


<div class="welcome-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="welcome-hero">
          <div class="hero-content">
            <!-- icon with floating animation -->
            <div class="icon-ring">
              <i class="fas fa-robot"></i>
            </div>

            <h1>AI <span class="highlight">Platform</span></h1>
            <p class="lead mb-4">Centralize and manage your AI agents and their tools/MCPs.</p>

            <ul class="nav nav-pills mb-4 justify-content-center" id="pills-tab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab" aria-controls="pills-login" aria-selected="true">Login</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab" aria-controls="pills-register" aria-selected="false">Register</button>
              </li>
            </ul>

            <div class="tab-content" id="pills-tabContent">
              <!-- Login Form -->
              <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="pills-login-tab">
                <form action="/login" method="POST" class="text-start">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email address</label>
                    <input type="email" name="email" class="form-control rounded-pill px-3" id="loginEmail" required>
                  </div>
                  <div class="mb-4">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control rounded-pill px-3" id="loginPassword" required>
                  </div>
                  <button type="submit" class="btn btn-primary-sleek-lg w-100 justify-content-center">
                    <i class="fas fa-sign-in-alt"></i> Log In
                  </button>
                </form>
              </div>

              <!-- Register Form -->
              <div class="tab-pane fade" id="pills-register" role="tabpanel" aria-labelledby="pills-register-tab">
                <form action="/register" method="POST" class="text-start">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <div class="mb-3">
                    <label for="regEmail" class="form-label">Email address</label>
                    <input type="email" name="email" class="form-control rounded-pill px-3" id="regEmail" required>
                  </div>
                  <div class="mb-3">
                    <label for="regPassword" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control rounded-pill px-3" id="regPassword" required>
                  </div>
                  <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control rounded-pill px-3" id="confirmPassword" required>
                  </div>
                  <button type="submit" class="btn btn-primary-sleek-lg w-100 justify-content-center">
                    <i class="fas fa-user-plus"></i> Register
                  </button>
                </form>
              </div>
            </div>

            <div class="divider"></div>

            <!-- feature strip -->
            <div class="feature-strip">
              <span class="feature-item">
                <i class="fas fa-brain"></i> AI Agents
              </span>
              <span class="feature-item">
                <i class="fas fa-tools"></i> Tools &amp; MCPs
              </span>
              <span class="feature-item">
                <i class="fas fa-shield-alt"></i> IAM Security
              </span>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
